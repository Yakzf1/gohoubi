<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>さんすうクイズ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Yomogi', sans-serif;
      text-align: center;
      background: #fff9f4;
      font-size: 4.5rem; /* 全体フォントをさらに大きく */
      margin: 0;
      padding: 0;
    }
    #score {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 3.5rem; /* スコアもさらに大きく */
      font-weight: bold;
      color: #ff6600;
    }
    #quiz-container {
      margin-top: 100px;
    }
    .balls {
      display: grid;
      grid-template-columns: repeat(9, 50px);
      justify-content: start;
      gap: 5px 5px;
      width: fit-content;
      margin: 0 auto;
      border-bottom: 1px solid #000;
      padding-bottom: 10px;
    }
    .ball {
      width: 40px;
      height: 40px;
      margin: 6px;
      border-radius: 50%;
      background-color: #4caf50;
    }
    .ball.sub {
      background-color: #f44336;
    }
    .choices {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 30px;
      gap: 15px;
    }
    .choice {
      padding: 20px 35px;
      font-size: 3rem; /* 選択肢も大きく */
      background: #ffeb3b;
      border: 3px solid #000;
      border-radius: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .choice:hover {
      background: #ffd600;
    }
  </style>
</head>
<body>
  <!-- ゲーム画面 -->
  <div id="score">⭐0</div>
  <div id="quiz-container">
    <div id="question"></div>
    <div id="balls"></div>
    <div class="choices" id="choices"></div>
  </div>

  <!-- 専用画面 -->
  <div id="special-screen">
    <div>ポイント管理</div>
    <input type="number" id="deduct-input" placeholder="数を入力">
    <button id="deduct-btn">確定</button>
    <button id="reset-btn">リセット</button>
  </div>

  <script>
    let score = 0;
    let mode = "add"; // add or sub

    const maxProblemValue = 9;   // 問題に使う数の最大値
    const saveKey = 'kodomo_quiz_save_v1'; //セーブキー

    let specialScreenCount = 0; // 専用画面カウント

    function save() {
      localStorage.setItem(saveKey, JSON.stringify({score: score}));
    }
    
    function load() {
      // セーブデータを読み込み
      const data = localStorage.getItem(saveKey);
      if (data) {
        const parsed = JSON.parse(data);
        score = parsed.score || 0;
      }

      // 管理画面のイベント処理
      initialSpecialScreen();
    }

    function initialSpecialScreen(){
      // 専用画面の処理
      const specialScreenDiv = document.getElementById("special-screen");
      const scoreDiv = document.getElementById("score");
      const deductBtn = document.getElementById("deduct-btn");
      const resetBtn = document.getElementById("reset-btn");
      const deductInput = document.getElementById("deduct-input");
      specialScreenDiv.hidden = true;

      // 専用画面を開くイベントを登録
      scoreDiv.addEventListener("click", () => {
        specialScreenCount++; // 変数をカウントアップ
        if(specialScreenCount > 4){
          specialScreenDiv.hidden = false;
          specialScreenCount = 0;          
        }
      });
      deductBtn.addEventListener("click", () => {
        score = score + parseInt(deductInput.value);
        specialScreenDiv.hidden = true;
        updateScore();
      });
      resetBtn.addEventListener("click", () => {
        score = 0;
        localStorage.setItem(saveKey, JSON.stringify({score: score}));
        updateScore();
      });      
    }
    
    function updateScore() {
      document.getElementById("score").textContent = "⭐" + score;
      save();
    }

    function generateProblem() {
      let a, b, answer;

      // モードをランダムで切り替え
      mode = (Math.floor(Math.random() * 10) + 1) % 2 === 1 ? "sub" : "add";

      if (mode === "add") {
        a = Math.floor(Math.random() * maxProblemValue) + 1;
        b = Math.floor(Math.random() * maxProblemValue) + 1;
        answer = a + b;
      } else { // 引き算        
        a = Math.floor(Math.random() * maxProblemValue) + 1;
        b = Math.floor(Math.random() * (a - 1)) + 1;
        answer = a - b;
      }

      document.getElementById("question").textContent =
        mode === "add" ? `${a} ＋ ${b} = ?` : `${a} − ${b} = ?`;

      showBalls(a, b);
      generateChoices(answer);
    }

    function showBalls(a, b) {
      const container = document.getElementById("balls");
      container.innerHTML = "";

      let ballsA = document.createElement("div");
      ballsA.className = "balls";
      for (let i = 0; i < a; i++) {
        let ball = document.createElement("div");
        ball.className = "ball";
        ballsA.appendChild(ball);
      }

      let ballsB = document.createElement("div");
      ballsB.className = "balls";
      for (let i = 0; i < b; i++) {
        let ball = document.createElement("div");
        ball.className = "ball" + (mode === "sub" ? " sub" : "");
        ballsB.appendChild(ball);
      }

      container.appendChild(ballsA);
      container.appendChild(ballsB);
    }

    function changeScore(num){
      score = score + num;
      if (score < 0) {
        score = 0;
      }
    }

    function generateChoices(answer) {
      const container = document.getElementById("choices");
      container.innerHTML = "";

      let choices = new Set([answer]);
      while (choices.size < 5) {
        let rand = Math.floor(Math.random() * (maxProblemValue * 2)) + 1;
        choices.add(rand);
      }

      let choiceArray = Array.from(choices).sort(() => Math.random() - 0.5);

      choiceArray.forEach(num => {
        let btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = num;
        btn.onclick = () => {
          if (num === answer) {
            changeScore(2);
          }
          else{
            changeScore(-1);
          }
          updateScore();
          generateProblem(); // 正解・不正解どちらでも次の問題へ
        };
        container.appendChild(btn);
      });
    }

    // 初回
    load();
    generateProblem();
    updateScore();
  </script>
</body>
</html>
