<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>そろばんをやってみよう！</title>
<style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(#ffeef5, #e0f7ff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    max-width: 1920px;
    max-height: 1080px;
    background: #fff;
    border-radius: 20px;
    padding: 1vh 1vw;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: 1fr 1.8fr;
}

#left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#question { font-size: 10vh; }
#answer { font-size: 8vh; margin-top: 2vh; }

button {
    font-size: 5vh;
    padding: 1vh 3vw;
    border: none;
    border-radius: 10px;
    background: #66ccff;
    color: white;
    margin-top: 6vh;
}

#result { font-size: 3vh; margin-top: 2vh; }

#right {
    display: flex;
    justify-content: center;
    align-items: center;
}

#abacus {
    display: flex;
    gap: 6vw;
}

.column {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* 上の珠（5） */
.top-bead {
    width: 8vh;
    height: 8vh;
    background: #ff9966;
    border-radius: 50%;
    margin-bottom: 2vh;
    cursor: pointer;
}

.top-bead.active {
    transform: translateY(2vh);
}

/* 下の珠（1×4） */
.bottom {
    display: flex;
    flex-direction: column-reverse;
    gap: 1vh;
}

.bead {
    width: 8vh;
    height: 8vh;
    background: #ffcc66;
    border-radius: 50%;
    cursor: pointer;
}

.bead.active {
    transform: translateY(-1vh);
    background: #ff8844;
}

.label {
    margin-top: 1vh;
    font-size: 2vh;
}
</style>
</head>
<body>
<div id="game">

<div id="left">
    <div id="question"></div>
    <div id="answer">こたえ: 0</div>
    <button onclick="checkAnswer()">こたえあわせ</button>
    <div id="result"></div>
</div>

<div id="right">
    <div id="abacus"></div>
</div>

</div>

<script>
let num1, num2, correct;
let ones = { top: null, bottom: [] };
let tens = { top: null, bottom: [] };

function newQuestion() {
    num1 = Math.floor(Math.random() * 9) + 1;
    num2 = Math.floor(Math.random() * 9) + 1;
    correct = num1 + num2;

    document.getElementById('question').innerText = `${num1} + ${num2} = ?`;
    document.getElementById('result').innerText = '';

    createAbacus();
}

function createColumn(obj) {
    const col = document.createElement('div');
    col.className = 'column';

    // 上（5）
    const top = document.createElement('div');
    top.className = 'top-bead';
    top.onclick = () => {
        top.classList.toggle('active');
        updateAnswer();
    };
    obj.top = top;

    // 下（1×4）
    const bottomWrap = document.createElement('div');
    bottomWrap.className = 'bottom';

    for (let i = 0; i < 4; i++) {
        const bead = document.createElement('div');
        bead.className = 'bead';

        bead.onclick = () => {
            bead.classList.toggle('active');
            updateAnswer();
        };

        bottomWrap.appendChild(bead);
        obj.bottom.push(bead);
    }

    col.appendChild(top);
    col.appendChild(bottomWrap);

    return col;
}

function createAbacus() {
    const abacus = document.getElementById('abacus');
    abacus.innerHTML = '';

    ones = { top: null, bottom: [] };
    tens = { top: null, bottom: [] };

    const tensCol = createColumn(tens);
    const onesCol = createColumn(ones);

    abacus.appendChild(tensCol);
    abacus.appendChild(onesCol);

    updateAnswer();
}

function calcValue(obj) {
    let val = 0;
    if (obj.top.classList.contains('active')) val += 5;
    val += obj.bottom.filter(b => b.classList.contains('active')).length;
    return val;
}

function updateAnswer() {
    const total = calcValue(tens) * 10 + calcValue(ones);
    document.getElementById('answer').innerText = `こたえ: ${total}`;
}

function checkAnswer() {
    const user = calcValue(tens) * 10 + calcValue(ones);

    if (user === correct) {
        document.getElementById('result').innerText = 'せいかい！ 🎉';
        setTimeout(newQuestion, 1200);
    } else {
        document.getElementById('result').innerText = 'ちがうよ 😢';
    }
}

newQuestion();
</script>
</body>
</html>
