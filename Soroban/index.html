<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>そろばんをやってみよう！</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(#ffeef5, #e0f7ff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            overflow: hidden;
        }

        #game {
            width: 100vw;
            height: 100%;
            max-width: 1920px;
            background: #fff;
            border-radius: 20px;
            padding: 1vh 1vw;
            box-sizing: border-box;

            /* 左右レイアウト */
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 1vw;
        }

        /* 左側（問題エリア） */
        #left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #question {
            font-size: 11vh;
        }

        #answer {
            font-size: 2vh;
            margin-top: 2vh;
        }

        button {
            font-size: 5vh;
            padding: 1vh 3vw;
            border: none;
            border-radius: 10px;
            background: #66ccff;
            color: white;
            margin-top: 6vh;
        }

        #result {
            font-size: 5vh;
            margin-top: 2vh;
        }

        /* 右側（そろばん） */
        #right {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #abacus {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6vw;
            width: 100%;
            height: 100%;
            padding: 2vh 0;
        }

        .column {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            justify-content: space-evenly;
            height: 100%;
        }

        .label {
            font-size: 2vh;
            text-align: center;
            margin-top: 1vh;
        }

        .bead {
            width: min(7.5vh, 7.5vw);
            height: min(7.5vh, 7.5vw);
            background: #ffcc66;
            border-radius: 50%;
            cursor: pointer;
        }

        .bead.active {
            background: #ff8844;
            transform: translateY(-2vh);
        }

        #score {
            position: absolute;
            top: 1vh;
            right: 2vw;
            font-size: 3vh;
            font-weight: bold;
            color: #ff6fa5;
        }   
        
        .tensLabel {
            font-size: 2.5vh;
            font-weight: bold;
            margin-top: 1vh;
            align-content: center;
            text-align: center;
        }

        .onesLabel {
            font-size: 2.5vh;
            font-weight: bold;
            margin-top: 1vh;
            align-content: center;
            text-align: center;
        }        
    </style>
</head>

<body>
    <div id="game">

        <div id="score">☆いいこポイント: 0</div>

        <div id="left">
            <div id="question"></div>
            <div id="answer">こたえ を こえにだして いってみよう！</div>
            <button onclick="checkAnswer()">こたえあわせ</button>
            <div id="result"></div>
        </div>

        <div id="right">
            <div id="abacus"></div>
        </div>

    </div>

    <script>
        let num1, num2, correct;
        let ones = [], tens = [];
        let prevTens = 0;
        let score = 0;

        function newQuestion() {
            operator = Math.random() < 0.5 ? '+' : '-';

            num1 = Math.floor(Math.random() * 9) + 1;
            num2 = Math.floor(Math.random() * 9) + 1;

            if (operator === '+') {
                correct = num1 + num2;
            } else {
                // マイナスでマイナス結果にならないように
                if (num1 < num2) [num1, num2] = [num2, num1];
                correct = num1 - num2;
            }

            document.getElementById('question').innerText = `${num1} ${operator} ${num2} = ?`;
            document.getElementById('result').innerText = '';

            createAbacus();
        }

        function createColumn(arr) {
            const col = document.createElement('div');
            col.className = 'column';

            for (let i = 0; i < 10; i++) {
                const bead = document.createElement('div');
                bead.className = 'bead';

                bead.addEventListener('click', () => {
                    const reversed = [...arr].reverse(); // 上→下順にする
                    const index = reversed.indexOf(bead);

                    if (!bead.classList.contains('active')) {
                        const canActivate = reversed
                            .slice(0, index)
                            .every(b => b.classList.contains('active'));

                        if (!canActivate) return;

                        bead.classList.add('active');
                    } else {
                        reversed.slice(index).forEach(b => b.classList.remove('active'));
                    }

                    updateAnswer();
                });

                col.appendChild(bead);
                arr.push(bead);
            }

            return col;
        }

        function createAbacus() {
            const abacus = document.getElementById('abacus');
            abacus.innerHTML = '';
            ones = [];
            tens = [];
            prevTens = 0;

            const tensCol = createColumn(tens);
            const onesCol = createColumn(ones);

            const tensWrap = document.createElement('div');
            tensWrap.appendChild(tensCol);
            const tensLabel = document.createElement('div');
            tensLabel.innerText = '0';
            tensLabel.className = 'tensLabel';
            tensLabel.id = 'tensLabel';
            tensWrap.appendChild(tensLabel);

            const onesWrap = document.createElement('div');
            onesWrap.appendChild(onesCol);
            const onesLabel = document.createElement('div');
            onesLabel.innerText = '0';
            onesLabel.className = 'onesLabel';
            onesLabel.id = 'onesLabel';
            onesWrap.appendChild(onesLabel);

            abacus.appendChild(tensWrap);
            abacus.appendChild(onesWrap);

            updateAnswer();
        }

        function updateAnswer() {
            let oneCount = ones.filter(b => b.classList.contains('active')).length;
            let tenCount = tens.filter(b => b.classList.contains('active')).length;

            // 1の位が10になったら10の位を増やして1の位リセット
            if (oneCount === 10) {
                ones.forEach(b => b.classList.remove('active'));
                oneCount = 0;

                // 10の位を+1（順番ルールに従ってON）
                for (let bead of [...tens].reverse()) {
                    if (!bead.classList.contains('active')) {
                        bead.classList.add('active');
                        break;
                    }
                }
                tenCount++;
            }

            // 10の位が0に減ったら → 1の位すべてON
            if (prevTens >= 1 && tenCount == 0) {
                ones.forEach(b => b.classList.add('active'));
                ones[0].classList.remove('active')
                oneCount = 9;
            }

            prevTens = tenCount;

            let label = document.getElementById('tensLabel');
            if (label) {
                label.innerText = tenCount;
            }
            label = document.getElementById('onesLabel');
            if (label) {
                label.innerText = oneCount;
            }
        }

        function checkAnswer() {
            let oneCount = ones.filter(b => b.classList.contains('active')).length;
            let tenCount = tens.filter(b => b.classList.contains('active')).length;
            let user = tenCount * 10 + oneCount;

            if (user === correct) {
                document.getElementById('result').innerText = 'せいかい！ 🎉';
                document.getElementById('question').innerText = `${num1} ${operator} ${num2} = ${correct}`;
                score = score + 2;
                setTimeout(newQuestion, 1200);
            } else {
                document.getElementById('result').innerText = 'ちがうよ 😢';
                score = score -1;
                if(score < 0) score = 0;
            }

            document.getElementById('score').innerText = `☆いいこポイント: ${score}`;
        }

        newQuestion();
    </script>
</body>

</html>
