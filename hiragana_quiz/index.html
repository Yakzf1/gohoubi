<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ひらがなパズル</title>
<style>
	body {
		font-family: 'Yomogi', sans-serif;
		text-align: center;
		background: #fff9f4;
		margin: 0;
	}
	/* 画像サイズ固定 */
	#question-img {
		width: 400px;
		height: 400px;
		object-fit: contain;
		border: 2px solid #ccc;
		border-radius: 10px;
		background: #fff;
		margin: 20px auto;
		display: block;
	}
	#puzzle {
		user-select: none;
	}
	#puzzle span {
		display: inline-block;
		padding: 10px 15px;
		margin: 5px;
		font-size: 1.5rem;
		background: #ffcccc;
		border-radius: 10px;
		cursor: grab;
		transition: transform 0.2s;
		position: relative;
	}
	#puzzle span.correct {
		animation: sparkle 0.8s ease-in-out;
		border: 2px solid gold;
		background: #fff8dc;
	}
	#message {
		font-size: 2rem;
		color: green;
		margin-top: 20px;
	}
	/* 紙吹雪用コンテナ */
	#confetti-container {
		pointer-events: none;
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		z-index: 9999;
	}
	.confetti {
		position: absolute;
		width: 10px;
		height: 10px;
		background-color: red;
		opacity: 0.8;
		animation: fall linear forwards;
	}
    h1 {
		font-family: 'Yomogi', cursive;
		font-size: 3rem;
		color: #ff69b4;
		text-shadow: 1px 1px 2px #ffa6c9;
		margin-top: 30px;
		margin-bottom: 10px;
    }
	@keyframes sparkle {
		0% { transform: scale(1); box-shadow: 0 0 0px gold; }
		50% { transform: scale(1.2); box-shadow: 0 0 15px gold; }
		100% { transform: scale(1); box-shadow: 0 0 0px gold; }
	}
	@keyframes fall {
		to {
			transform: translateY(100vh) rotate(360deg);
			opacity: 0;
		}
	}
</style>
</head>
<body>

<h1>ひらがなパズル</h1>
<img id="question-img" src="" alt="クイズ画像" />
<div id="puzzle"></div>
<div id="message"></div>
<div id="confetti-container"></div>

<script>
	let questions = [
		{ answer: "りんご", img: "https://sozai.bookclick.jp/wp-content/uploads/2023/04/apple-illustration.png" },
		{ answer: "くるま", img: "https://illustimage.com/photo/748.png" },
		{ answer: "さかな", img: "https://iconbu.com/wp-content/uploads/2022/07/%E3%81%8A%E9%AD%9A%E3%81%95%E3%82%93.jpg" },
		{ answer: "いちご", img: "https://illustimage.com/photo/2415.png" },
		{ answer: "かばん", img: "https://tsukatte.com/wp-content/uploads/2019/12/tote-bag_red.png" },
		{ answer: "はなび", img: "https://sozai-good.com/uploads/87243/87243_thumbnail.png" },
		{ answer: "くつした", img: "https://eiyoushi-hutaba.com/wp-content/uploads/2021/06/%E9%9D%B4%E4%B8%8B.png" },
		{ answer: "とけい", img: "https://illustkun.com/wp-content/uploads/illustkun-05689-clock.png" },
		{ answer: "おにぎり", img: "https://creatime.net/wp-content/uploads/2023/09/riceball.png" },
		{ answer: "たまご", img: "https://tsukatte.com/wp-content/uploads/2020/02/egg_ec.png" },
		{ answer: "ぬいぐるみ", img: "https://tsukatte.com/wp-content/uploads/2021/01/stuffed-bear_lightbrown.png" },
		{ answer: "しゃぼんだま", img: "https://thumb.ac-illust.com/ba/ba70a47e761cf3ed71a1fb508044e0dc_t.jpeg" },
		{ answer: "ちょうちょ", img: "https://irasutogakari.com/wp-content/uploads/2021/01/sozai-358.png" },
		{ answer: "さくらんぼ", img: "https://nureyon.com/sample/95/cherry-1-p2.svg?1714209205" },
		{ answer: "ゆきだるま", img: "https://t4.ftcdn.net/jpg/05/43/33/93/360_F_543339311_zEPmUxqPWXuU9wvNtDkwbS6z2hQUNuHG.jpg" },
		{ answer: "こーら", img: "https://sozaberi.com/wp-content/uploads/2023/04/sb_drink_cola01.png" },
		{ answer: "みかん", img: "https://www.kaigo-antenna.jp/uploads/illustration/main_image/794/webp_202107_014_s.webp" },
	];

	let currentQuestion;
	let currentImageIndex = -1;
	let letters = [];
	let dragSrcIndex = null;
	let dragClone = null;
	let dragOffsetX = 0;
	let dragOffsetY = 0;
    let isAnimating = false;  // 追加：操作可能フラグ

	function startGame() {
		currentImageIndex = (currentImageIndex + 1) % questions.length;
		currentQuestion = questions[currentImageIndex];
		document.getElementById("question-img").src = currentQuestion.img;

		// 画像読み込み失敗時
		const imgEl = document.getElementById("question-img");
		imgEl.onerror = () => {
			startGame();
		};

		// 文字をシャッフル（元と同じ並びにならないように）
		letters = currentQuestion.answer.split("");
		do {
			shuffleArray(letters);
		} while (letters.join('') === currentQuestion.answer);

		createPuzzle();
		document.getElementById("message").textContent = "";
	}

	function shuffleArray(arr) {
		for (let i = arr.length - 1; i > 0; i--) {
			const j = Math.floor(Math.random() * (i + 1));
			[arr[i], arr[j]] = [arr[j], arr[i]];
		}
	}

	function createPuzzle() {
		const container = document.getElementById("puzzle");
		container.innerHTML = "";

		letters.forEach((letter, index) => {
			const span = document.createElement("span");
			span.textContent = letter;
			span.dataset.index = index;

			function onDragStart(e) {
                if (isAnimating) return;  // アニメ中は操作無効
				dragSrcIndex = index;

				// クローン作成
				dragClone = span.cloneNode(true);
				dragClone.style.position = "fixed";
				dragClone.style.pointerEvents = "none";
				dragClone.style.opacity = "0.7";
				dragClone.style.zIndex = "10000";
				dragClone.style.width = span.offsetWidth + "px";
				dragClone.style.height = span.offsetHeight + "px";

				let clientX, clientY;
				if (e.type.startsWith("touch")) {
					clientX = e.touches[0].clientX;
					clientY = e.touches[0].clientY;
				} else {
					clientX = e.clientX;
					clientY = e.clientY;
				}

				const rect = span.getBoundingClientRect();
				dragOffsetX = clientX - rect.left;
				dragOffsetY = clientY - rect.top;

				moveDragClone(clientX, clientY);

				document.body.appendChild(dragClone);

				// 元のspanは透明化
				span.style.opacity = "0.3";

				if (e.type === "mousedown") {
					window.addEventListener("mousemove", onDragMove);
					window.addEventListener("mouseup", onDragEnd);
				} else if (e.type === "touchstart") {
					window.addEventListener("touchmove", onDragMove, { passive: false });
					window.addEventListener("touchend", onDragEnd);
				}
				e.preventDefault();
			}

			function onDragMove(e) {
				let clientX, clientY;
				if (e.type === "touchmove") {
					clientX = e.touches[0].clientX;
					clientY = e.touches[0].clientY;
					e.preventDefault();
				} else {
					clientX = e.clientX;
					clientY = e.clientY;
				}
				moveDragClone(clientX, clientY);
			}

			function moveDragClone(x, y) {
				if (!dragClone) return;
				dragClone.style.left = (x - dragOffsetX) + "px";
				dragClone.style.top = (y - dragOffsetY) + "px";
			}

			function onDragEnd(e) {
				let clientX, clientY;
				if (e.type === "touchend") {
					clientX = e.changedTouches[0].clientX;
					clientY = e.changedTouches[0].clientY;
				} else {
					clientX = e.clientX;
					clientY = e.clientY;
				}

				if (dragClone) {
					dragClone.remove();
					dragClone = null;
				}

				span.style.opacity = "";

				if (e.type === "mouseup") {
					window.removeEventListener("mousemove", onDragMove);
					window.removeEventListener("mouseup", onDragEnd);
				} else if (e.type === "touchend") {
					window.removeEventListener("touchmove", onDragMove);
					window.removeEventListener("touchend", onDragEnd);
				}

				// ドロップ先要素取得
				const targetEl = document.elementFromPoint(clientX, clientY);
				if (targetEl && targetEl.dataset && targetEl.dataset.index !== undefined) {
					const tgtIndex = Number(targetEl.dataset.index);
					if (tgtIndex !== dragSrcIndex) {
						swapAndCheck(dragSrcIndex, tgtIndex);
					}
				}
			}

			span.addEventListener("mousedown", onDragStart);
			span.addEventListener("touchstart", onDragStart, { passive: false });

			container.appendChild(span);
		});
	}

	function swapAndCheck(a, b) {
		[letters[a], letters[b]] = [letters[b], letters[a]];
		createPuzzle();
		checkAnswer();
	}

	function checkAnswer() {
		if (letters.join("") === currentQuestion.answer) {
            isAnimating = true;  // アニメーション開始で操作無効化
			document.getElementById("message").textContent = "せいかい！🎉";
			document.querySelectorAll("#puzzle span").forEach(el => {
				el.classList.add("correct");
			});
			launchConfetti();
            setTimeout(() => {
                isAnimating = false;  // アニメ終了で操作可能に戻す
                startGame();
            }, 2500);
		}
	}

	function launchConfetti() {
		const confettiContainer = document.getElementById("confetti-container");
		confettiContainer.innerHTML = "";
		const colors = ["#ff0", "#0f0", "#0ff", "#f0f", "#f00", "#00f"];
		const total = 50;

		for (let i = 0; i < total; i++) {
			const confetti = document.createElement("div");
			confetti.classList.add("confetti");
			confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
			confetti.style.left = Math.random() * 100 + "vw";
			confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";
			confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
			confettiContainer.appendChild(confetti);
		}
	}

	shuffleArray(questions);
	startGame();
</script>

</body>
</html>
