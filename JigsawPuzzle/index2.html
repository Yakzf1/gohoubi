<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ジグソーパズル</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa&display=swap');

    body {
      font-family: 'Comfortaa', cursive, sans-serif;
      background: #fff0f6;
      text-align: center;
      color: #d6336c;
      padding: 5px;
      user-select: none;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px #ffc0cbaa;
    }

    button {
      background: #ff77a9;
      border: none;
      color: white;
      font-size: 1.3rem;
      padding: 10px 30px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(255, 119, 169, 0.5);
      transition: background 0.3s ease;
      margin-bottom: 20px;
    }

    button:hover {
      background: #ff4d8d;
    }

    #puzzle {
      display: grid;
      gap: 6px;
      margin: 0 auto 20px auto;
      width: max-content;
      touch-action: none;
    }

    .piece {
      background-size: var(--image-size) var(--image-size);
      border-radius: 15px;
      border: 2px solid #ffb6c1;
      box-shadow: 0 6px 10px rgba(255, 182, 193, 0.5);
      user-select: none;
      position: relative;
      touch-action: none;
    }

    .drag-over {
      border-color: #ff69b4;
      box-shadow: 0 0 12px 4px #ff69b4aa;
    }

    #message {
      font-size: 2.3rem;
      font-weight: bold;
      margin: 0 auto 20px auto;
      color: #e91e63;
      text-shadow: 1px 1px 2px #ffc0cbaa;
      min-height: 2rem;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

<h1>ジグソーパズル💖</h1>
<button onclick="initPuzzle()">スタート</button>
<div id="puzzle"></div>
<p id="message"></p>
<canvas id="confetti"></canvas>

<script>
  const GRID_SIZE = 3;
  const IMAGE_SIZE = 600;
  const PIECE_SIZE = IMAGE_SIZE / GRID_SIZE;

  const imageList = [
    "https://precure-web.com/you-and-idol/assets/images/top/p_top-mv_03_sp.png",
    "https://precure-web.com/you-and-idol/assets/images/top/p_top-mv_04_sp.png",
    "https://precure-web.com/delicious-party/assets/img/character/p_01_style4b_sp.png"
  ];

  let currentImageIndex = 0;
  let pieces = [];
  const puzzle = document.getElementById("puzzle");
  const message = document.getElementById("message");
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");

  document.documentElement.style.setProperty('--piece-size', PIECE_SIZE + 'px');
  document.documentElement.style.setProperty('--image-size', IMAGE_SIZE + 'px');

  puzzle.style.gridTemplateColumns = `repeat(${GRID_SIZE}, ${PIECE_SIZE}px)`;
  puzzle.style.gridTemplateRows = `repeat(${GRID_SIZE}, ${PIECE_SIZE}px)`;

  function shuffle(array) {
    for (let i = array.length -1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i+1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function initPuzzle(shufflePieces = true) {
    const imageURL = imageList[currentImageIndex];
    if (shufflePieces) {
      pieces = shuffle([...Array(GRID_SIZE * GRID_SIZE).keys()]);
    }
    puzzle.innerHTML = "";
    message.textContent = "";

    pieces.forEach((pos, index) => {
      const piece = document.createElement("div");
      piece.className = "piece";
      piece.style.width = PIECE_SIZE + "px";
      piece.style.height = PIECE_SIZE + "px";
      piece.style.backgroundImage = `url(${imageURL})`;
      const x = (pos % GRID_SIZE) * -PIECE_SIZE;
      const y = Math.floor(pos / GRID_SIZE) * -PIECE_SIZE;
      piece.style.backgroundPosition = `${x}px ${y}px`;
      piece.dataset.index = index;
      piece.dataset.correct = pos;

      // タッチ＆マウス対応
      let isDragging = false;
      let startX, startY;
      let draggedPiece;

      piece.addEventListener("pointerdown", e => {
        isDragging = true;
        draggedPiece = e.target;
        startX = e.clientX;
        startY = e.clientY;
        draggedPiece.style.zIndex = 100;
        draggedPiece.style.position = "absolute";
        document.body.appendChild(draggedPiece);
      });

      window.addEventListener("pointermove", e => {
        if (isDragging && draggedPiece) {
          draggedPiece.style.left = (e.clientX - PIECE_SIZE / 2) + "px";
          draggedPiece.style.top = (e.clientY - PIECE_SIZE / 2) + "px";
        }
      });

      window.addEventListener("pointerup", e => {
        if (isDragging && draggedPiece) {
          isDragging = false;

          const dropIndex = [...puzzle.children].findIndex(el => {
            const rect = el.getBoundingClientRect();
            return e.clientX > rect.left && e.clientX < rect.right && e.clientY > rect.top && e.clientY < rect.bottom;
          });

          if (dropIndex !== -1) {
            const fromIndex = draggedPiece.dataset.index;
            swapPieces(fromIndex, dropIndex);
          }
          draggedPiece.style.position = "";
          draggedPiece.style.left = "";
          draggedPiece.style.top = "";
          draggedPiece.style.zIndex = "";
          puzzle.appendChild(draggedPiece);
          draggedPiece = null;
        }
      });

      puzzle.appendChild(piece);
    });
  }

  function swapPieces(from, to) {
    [pieces[from], pieces[to]] = [pieces[to], pieces[from]];
    initPuzzle(false);
    checkSolved();
  }

  function checkSolved() {
    const solved = pieces.every((pos, i) => pos === i);
    if (solved) {
      message.textContent = "かんせい！すごーい！🎉";
      showConfetti();
      setTimeout(() => {
        currentImageIndex = (currentImageIndex + 1) % imageList.length;
        initPuzzle();
      }, 5000);
    } else {
      message.textContent = "";
    }
  }

  function showConfetti() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = Array.from({ length: 100 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 6 + 4,
      dx: (Math.random() - 0.5) * 4,
      dy: Math.random() * -4 - 2,
      color: `hsl(${Math.random() * 360}, 100%, 75%)`
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });
    }

    function update() {
      particles.forEach(p => {
        p.x += p.dx;
        p.y += p.dy;
        p.dy += 0.1;
      });
    }

    let count = 0;
    const interval = setInterval(() => {
      draw();
      update();
      if (++count > 60) clearInterval(interval);
    }, 50);
  }

  initPuzzle();
</script>

</body>
</html>
