<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ジグソーパズル💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Yomogi&display=swap');
    body {
      font-family: 'Yomogi', cursive;
      background: #fff0f6;
      text-align: center;
      color: #d6336c;
      padding: 10px;
      user-select: none;
    }
    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px #ffc0cb88;
    }
    button {
      background: #ff77a9;
      border: none;
      color: white;
      font-size: 1.3rem;
      padding: 10px 30px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(255, 119, 169, 0.5);
      transition: background 0.3s ease;
      margin-bottom: 20px;
    }
    button:hover {
      background: #ff4d8d;
    }
    #puzzle {
      display: grid;
      gap: 4px;
      margin: 0 auto 20px auto;
      width: max-content;
      touch-action: none;
    }
    .piece {
      background-size: 600px 600px;
      border-radius: 15px;
      border: 2px solid #ffb6c1;
      box-shadow: 0 6px 10px rgba(255, 182, 193, 0.5);
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .piece:active {
      cursor: grabbing;
      transform: scale(1.05);
      box-shadow: 0 10px 15px rgba(255, 182, 193, 0.8);
    }
    .drag-over {
      border-color: #ff69b4;
      box-shadow: 0 0 12px 4px #ff69b4aa;
    }
    #message {
      font-size: 2rem;
      font-weight: bold;
      color: #e91e63;
      text-shadow: 1px 1px 2px #ffc0cb88;
      min-height: 2.2rem;
      margin: 0 auto 20px auto;
    }
    .confetti {
      position: fixed;
      width: 100vw;
      height: 100vh;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }
    .confetti div {
      position: absolute;
      width: 10px;
      height: 10px;
      background: pink;
      animation: fall 3s linear infinite;
      border-radius: 50%;
    }
    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<h1>ジグソーパズル💖 ver 1.1.5</h1>
<div id="puzzle"></div>
<p id="message"></p>
<div class="confetti" id="confetti"></div>

<script>
  const GRID = 3;
  const SIZE = 600;
  const PIECE_SIZE = SIZE / GRID;
  const puzzle = document.getElementById("puzzle");
  const message = document.getElementById("message");
  const confetti = document.getElementById("confetti");

  // パズル画像の元データ
  let images = [
    "https://precure-web.com/you-and-idol/assets/images/top/p_top-mv_05_sp.png",
    "https://precure-web.com/you-and-idol/assets/images/top/p_top-mv_01_sp.png",
    "https://precure-web.com/you-and-idol/assets/images/top/p_top-mv_02_sp.png",
    "https://precure-web.com/you-and-idol/assets/images/top/p_top-mv_03_sp.png",
    "https://precure-web.com/you-and-idol/assets/images/top/p_top-mv_04_sp.png",
    "https://precure-web.com/you-and-idol/assets/images/top/p_top-mv_05_sp.png",
    "https://precure-web.com/you-and-idol/assets/images/top/p_top-mv_06_sp.png",
    "https://precure-web.com/delicious-party/assets/img/character/p_01_style4b_sp.png",
    "https://aipri.jp/anime/wp/wp-content/themes/aipri_anime_v2/assets/images/common/character/img_character_mitsuki_2.png",
    "https://aipri.jp/anime/wp/wp-content/themes/aipri_anime_v2/assets/images/common/character/img_character_himari_2.png",
    "https://statics.tver.jp/images/content/thumbnail/episode/xlarge/epbwhvdsiw.jpg?v=17",
    "https://d34gglw95p9zsk.cloudfront.net/articles/images/000/032/949/large/3725bf48-42b8-4bd8-b477-92aa9e652c34.jpg?1746198450",
    "https://cdn-ak.f.st-hatena.com/images/fotolife/h/hisonobi/20250601/20250601140203.jpg",
    "https://www.toei-anim.co.jp/tv/wonderful_precure/assets/images/character/curewonderful/p_character01_style01_sp.webp",
    "https://www.toei-anim.co.jp/tv/wonderful_precure/assets/images/character/curewonderful/p_character03_style01_sp.webp",
    "https://d34gglw95p9zsk.cloudfront.net/articles/images/000/028/977/large/21fbfcee-b44a-454a-9f4f-17357845be79.jpg?1716553831",
    "https://youpouch.com/wp-content/uploads/sites/4/2024/07/sub2_804d79.jpg",
    "https://i.ytimg.com/vi/EZXK7TMhrG0/hqdefault.jpg",
    "https://i.ytimg.com/vi/hGwxzmx86fw/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLAN-PpEnihSdj3BKuhN-HLK-0y4rQ",
  ];
  let currentImageIndex = 0;
  let pieces = [];

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  let touchDragClone = null;  // クローン要素
  let touchStartIndex = null; // ドラッグ開始ピースindex
  let touchCurrentIndex = null; // ドラッグ中のターゲットindex

  function initPuzzle() {
    pieces = shuffle([...Array(GRID * GRID).keys()]);
    puzzle.style.gridTemplateColumns = `repeat(${GRID}, ${PIECE_SIZE}px)`;
    puzzle.style.gridTemplateRows = `repeat(${GRID}, ${PIECE_SIZE}px)`;
    puzzle.innerHTML = "";
    message.textContent = "";
    confetti.innerHTML = "";

    pieces.forEach((pos, index) => {
      const div = document.createElement("div");
      div.className = "piece";
      div.style.width = div.style.height = PIECE_SIZE + "px";
      div.style.backgroundImage = `url(${images[currentImageIndex]})`;
      const x = (pos % GRID) * -PIECE_SIZE;
      const y = Math.floor(pos / GRID) * -PIECE_SIZE;
      div.style.backgroundPosition = `${x}px ${y}px`;
      div.dataset.index = index;
      div.dataset.correct = pos;
      div.draggable = true;

      // PC用ドラッグ＆ドロップ
      div.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/plain", index);
      });
      div.addEventListener("dragover", e => {
        e.preventDefault();
        div.classList.add("drag-over");
      });
      div.addEventListener("dragleave", () => {
        div.classList.remove("drag-over");
      });
      div.addEventListener("drop", e => {
        e.preventDefault();
        div.classList.remove("drag-over");
        const from = parseInt(e.dataTransfer.getData("text/plain"));
        swapPieces(from, index);
      });

      // タッチ用イベント
      div.addEventListener("touchstart", e => {
        if (e.touches.length !== 1) return;
        const touch = e.touches[0];
        touchStartIndex = index;

        // 半透明クローンを作成
        touchDragClone = div.cloneNode(true);
        touchDragClone.style.position = "fixed";
        touchDragClone.style.pointerEvents = "none";
        touchDragClone.style.opacity = "0.6";
        touchDragClone.style.zIndex = "10000";
        touchDragClone.style.width = div.offsetWidth + "px";
        touchDragClone.style.height = div.offsetHeight + "px";
        touchDragClone.style.left = touch.clientX - div.offsetWidth / 2 + "px";
        touchDragClone.style.top = touch.clientY - div.offsetHeight / 2 + "px";
        touchDragClone.style.transform = "none";
        document.body.appendChild(touchDragClone);

        e.preventDefault();
      }, { passive: false });

      div.addEventListener("touchmove", e => {
        if (!touchDragClone) return;
        for (let touch of e.changedTouches) {
          // タッチ位置にクローンを追従
          touchDragClone.style.left = touch.clientX - div.offsetWidth / 2 + "px";
          touchDragClone.style.top = touch.clientY - div.offsetHeight / 2 + "px";
          e.preventDefault();
        }
      }, { passive: false });

      div.addEventListener("touchend", e => {
        if (!touchDragClone) return;

        for (let touch of e.changedTouches) {
          // ドロップ判定
          const dropElem = document.elementFromPoint(touch.clientX, touch.clientY);
          if (dropElem && dropElem.classList.contains("piece")) {
            touchCurrentIndex = parseInt(dropElem.dataset.index);
            if (touchStartIndex !== null && touchCurrentIndex !== null && touchStartIndex !== touchCurrentIndex) {
              swapPieces(touchStartIndex, touchCurrentIndex);
            }
          }
        }

        // クローン削除＆リセット
        if (touchDragClone && touchDragClone.parentNode) {
          touchDragClone.parentNode.removeChild(touchDragClone);
        }
        touchDragClone = null;
        touchStartIndex = null;
        touchCurrentIndex = null;

        e.preventDefault();
      }, { passive: false });

      puzzle.appendChild(div);
    });
  }

  function swapPieces(from, to) {
    [pieces[from], pieces[to]] = [pieces[to], pieces[from]];
    updatePuzzle();
    checkSolved();
  }

  function updatePuzzle() {
    [...puzzle.children].forEach((div, i) => {
      const pos = pieces[i];
      const x = (pos % GRID) * -PIECE_SIZE;
      const y = Math.floor(pos / GRID) * -PIECE_SIZE;
      div.style.backgroundPosition = `${x}px ${y}px`;
      div.dataset.correct = pos;
    });
  }

  function checkSolved() {
    const isCorrect = pieces.every((pos, i) => pos === i);
    if (isCorrect) {
      message.textContent = "かんせい！すごーい！🎉" + '\n' + (currentImageIndex + 1) + "こ くりあ！";
      startConfetti();
      setTimeout(() => {
        currentImageIndex = (currentImageIndex + 1) % images.length;
        initPuzzle();
      }, 3000);
    } else {
      message.textContent = "";
    }
  }

  function startConfetti() {
    for (let i = 0; i < 100; i++) {
      const div = document.createElement("div");
      div.style.left = Math.random() * 100 + "vw";
      div.style.background = `hsl(${Math.random() * 360}, 100%, 80%)`;
      div.style.animationDelay = Math.random() * 2 + "s";
      confetti.appendChild(div);
    }
  }

  async function checkImages(images) {
    const validImages = [];

    const checks = images.map((url) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          validImages.push(url);
          resolve();
        };
        img.onerror = () => {
          resolve();
        };
        img.src = url;
      });
    });

    await Promise.all(checks);
    return validImages;
  }

  async function start() {
    images = [...new Set(images)];
    images = await checkImages(images);
    if (images.length === 0) {
      message.textContent = "画像が見つかりませんでした😭";
      return;
    }
    images = shuffle(images);
    initPuzzle();
  }  

  // 初期動作 
  // －－－－－－－－－－－－－－－－－
  start();
  
</script>

</body>
</html>
