<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ジグソーパズル</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa&display=swap');

    body {
      font-family: 'Comfortaa', cursive, sans-serif;
      background: #fff0f6;
      text-align: center;
      color: #d6336c;
      padding: 5px;
      user-select: none;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px #ffc0cbaa;
    }

    button {
      background: #ff77a9;
      border: none;
      color: white;
      font-size: 1.3rem;
      padding: 10px 30px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(255, 119, 169, 0.5);
      transition: background 0.3s ease;
      margin-bottom: 20px;
      user-select: none;
    }

    button:hover {
      background: #ff4d8d;
    }

    #puzzle {
      display: grid;
      grid-template-columns: repeat(3, var(--piece-size));
      grid-template-rows: repeat(3, var(--piece-size));
      gap: 6px;
      margin: 0 auto 20px auto;
      width: max-content;
      touch-action: none;
      position: relative;
    }

    .piece {
      width: var(--piece-size);
      height: var(--piece-size);
      background-size: var(--image-size) var(--image-size);
      border-radius: 15px;
      border: 2px solid #ffb6c1;
      box-shadow: 0 6px 10px rgba(255, 182, 193, 0.5);
      cursor: grab;
      transition: transform 0.2s ease;
      user-select: none;
    }

    .piece:active {
      cursor: grabbing;
      transform: scale(1.05);
      box-shadow: 0 10px 15px rgba(255, 182, 193, 0.8);
    }

    .drag-over {
      border-color: #ff69b4;
      box-shadow: 0 0 12px 4px #ff69b4aa;
    }

    .piece.dragging {
      opacity: 0.8;
    }

    #message {
      font-size: 2.3rem;
      font-weight: bold;
      margin: 0 auto 20px auto;
      color: #e91e63;
      text-shadow: 1px 1px 2px #ffc0cbaa;
      min-height: 2rem;
      user-select: none;
      animation: messageFlash 1s infinite alternate;
    }

    canvas#fireworks {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    @keyframes messageFlash {
      0%, 100% { color: #e91e63; text-shadow: 0 0 10px #ff4081; }
      50% { color: #ff4081; text-shadow: 0 0 20px #f48fb1; }
    }
  </style>
</head>
<body>

<h1>ジグソーパズル💖</h1>
<button onclick="initPuzzle()">スタート</button>
<canvas id="fireworks"></canvas>
<div id="puzzle"></div>
<p id="message"></p>

<script>
  const GRID_SIZE = 3;
  const IMAGE_SIZE = 600;
  const PIECE_SIZE = IMAGE_SIZE / GRID_SIZE;

  const puzzle = document.getElementById("puzzle");
  const message = document.getElementById("message");
  const imageList = [
    "https://precure-web.com/you-and-idol/assets/images/top/p_top-mv_03_sp.png",
    "https://precure-web.com/you-and-idol/assets/images/top/p_top-mv_04_sp.png",
    "https://precure-web.com/delicious-party/assets/img/character/p_01_style4b_sp.png"
  ];
  let imageIndex = 0;
  let pieces = [];

  function setCSSVariables() {
    document.documentElement.style.setProperty('--piece-size', PIECE_SIZE + 'px');
    document.documentElement.style.setProperty('--image-size', IMAGE_SIZE + 'px');
  }

  setCSSVariables();

  function shuffle(array) {
    for (let i = array.length -1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i+1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function initPuzzle(shufflePieces = true) {
    if (shufflePieces) {
      pieces = shuffle([...Array(GRID_SIZE * GRID_SIZE).keys()]);
    }
    puzzle.innerHTML = "";
    message.textContent = "";

    pieces.forEach((pos, index) => {
      const piece = document.createElement("div");
      piece.className = "piece";
      piece.draggable = true;
      piece.dataset.index = index;
      piece.dataset.correct = pos;
      piece.style.backgroundImage = `url(${imageList[imageIndex]})`;
      const x = (pos % GRID_SIZE) * -PIECE_SIZE;
      const y = Math.floor(pos / GRID_SIZE) * -PIECE_SIZE;
      piece.style.backgroundPosition = `${x}px ${y}px`;

      // マウスドラッグ
      piece.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/plain", index);
      });

      piece.addEventListener("dragover", e => {
        e.preventDefault();
        piece.classList.add("drag-over");
      });

      piece.addEventListener("dragleave", () => {
        piece.classList.remove("drag-over");
      });

      piece.addEventListener("drop", e => {
        e.preventDefault();
        piece.classList.remove("drag-over");
        const fromIndex = e.dataTransfer.getData("text/plain");
        swapPieces(fromIndex, index);
      });

      // タッチ操作
      piece.addEventListener("touchstart", e => {
        const touch = e.touches[0];
        piece.classList.add("dragging");
        piece.dataset.touchId = touch.identifier;
        piece.dataset.startX = touch.clientX;
        piece.dataset.startY = touch.clientY;
        piece.dataset.index = index;
        piece.style.position = "absolute";
        piece.style.zIndex = 1000;
        piece.style.pointerEvents = "none";
      }, { passive: true });

      piece.addEventListener("touchmove", e => {
        const touch = e.touches[0];
        if (touch.identifier != piece.dataset.touchId) return;
        const dx = touch.clientX - piece.dataset.startX;
        const dy = touch.clientY - piece.dataset.startY;
        piece.style.transform = `translate(${dx}px, ${dy}px)`;
      }, { passive: true });

      piece.addEventListener("touchend", e => {
        piece.style.transform = "";
        piece.style.position = "";
        piece.style.zIndex = "";
        piece.style.pointerEvents = "";
        piece.classList.remove("dragging");

        const fromIndex = piece.dataset.index;
        const touch = e.changedTouches[0];
        const toElem = document.elementFromPoint(touch.clientX, touch.clientY);
        const toIndex = toElem?.dataset?.index;
        if (toIndex !== undefined && fromIndex !== toIndex) {
          swapPieces(fromIndex, toIndex);
        }
      });

      puzzle.appendChild(piece);
    });
  }

  function swapPieces(from, to) {
    [pieces[from], pieces[to]] = [pieces[to], pieces[from]];
    initPuzzle(false);
    checkSolved();
  }

  function checkSolved() {
    const solved = pieces.every((pos, i) => pos === i);
    if (solved) {
      message.textContent = "かんせい！すごーい！🎉";
      showCelebration();
      setTimeout(() => {
        imageIndex = (imageIndex + 1) % imageList.length;
        initPuzzle();
      }, 5000);
    } else {
      message.textContent = "";
    }
  }

  // 花火演出
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animationFrameId;

  function showCelebration() {
    resizeCanvas();
    createParticles();
    animateFireworks();
    setTimeout(() => cancelAnimationFrame(animationFrameId), 4000);
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function createParticles() {
    particles = [];
    for (let i = 0; i < 100; i++) {
      particles.push({
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        alpha: 1,
        radius: Math.random() * 3 + 2
      });
    }
  }

  function animateFireworks() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.02;
    });
    particles = particles.filter(p => p.alpha > 0);
    ctx.fillStyle = "#ff69b4";
    particles.forEach(p => {
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (particles.length > 0) {
      animationFrameId = requestAnimationFrame(animateFireworks);
    }
  }

  window.addEventListener('resize', resizeCanvas);
  initPuzzle();
</script>

</body>
</html>
