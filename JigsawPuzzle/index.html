<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ジグソーパズル💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Yomogi&display=swap');
    body {
      font-family: 'Yomogi', cursive;
      background: #fff0f6;
      text-align: center;
      color: #d6336c;
      padding: 10px;
      user-select: none;
    }
    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px #ffc0cb88;
    }
    button {
      background: #ff77a9;
      border: none;
      color: white;
      font-size: 1.3rem;
      padding: 10px 30px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(255, 119, 169, 0.5);
      transition: background 0.3s ease;
      margin-bottom: 20px;
    }
    button:hover {
      background: #ff4d8d;
    }
    #puzzle {
      display: grid;
      gap: 6px;
      margin: 0 auto 20px auto;
      width: max-content;
      touch-action: none;
    }
    .piece {
      background-size: 600px 600px;
      border-radius: 15px;
      border: 2px solid #ffb6c1;
      box-shadow: 0 6px 10px rgba(255, 182, 193, 0.5);
      cursor: grab;
      user-select: none;
    }
    .piece:active {
      cursor: grabbing;
      transform: scale(1.05);
      box-shadow: 0 10px 15px rgba(255, 182, 193, 0.8);
    }
    .drag-over {
      border-color: #ff69b4;
      box-shadow: 0 0 12px 4px #ff69b4aa;
    }
    #message {
      font-size: 2rem;
      font-weight: bold;
      color: #e91e63;
      text-shadow: 1px 1px 2px #ffc0cb88;
      min-height: 2.2rem;
    }
    .confetti {
      position: fixed;
      width: 100vw;
      height: 100vh;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }
    .confetti div {
      position: absolute;
      width: 10px;
      height: 10px;
      background: pink;
      animation: fall 3s linear infinite;
      border-radius: 50%;
    }
    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<h1>ジグソーパズル💖 ver 1.0.2</h1>
<button onclick="initPuzzle()">スタート</button>
<div id="puzzle"></div>
<p id="message"></p>
<div class="confetti" id="confetti"></div>

<script>
  const GRID = 3;
  const SIZE = 600;
  const PIECE_SIZE = SIZE / GRID;
  const puzzle = document.getElementById("puzzle");
  const message = document.getElementById("message");
  const confetti = document.getElementById("confetti");

  const images = [
    "https://precure-web.com/you-and-idol/assets/images/top/p_top-mv_03_sp.png",
    "https://precure-web.com/you-and-idol/assets/images/top/p_top-mv_04_sp.png",
    "https://precure-web.com/delicious-party/assets/img/character/p_01_style4b_sp.png"
  ];
  let currentImageIndex = 0;
  let pieces = [];

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function initPuzzle() {
    pieces = shuffle([...Array(GRID * GRID).keys()]);
    puzzle.style.gridTemplateColumns = `repeat(${GRID}, ${PIECE_SIZE}px)`;
    puzzle.style.gridTemplateRows = `repeat(${GRID}, ${PIECE_SIZE}px)`;
    puzzle.innerHTML = "";
    message.textContent = "";
    confetti.innerHTML = "";

    pieces.forEach((pos, index) => {
      const div = document.createElement("div");
      div.className = "piece";
      div.style.width = div.style.height = PIECE_SIZE + "px";
      div.style.backgroundImage = `url(${images[currentImageIndex]})`;
      const x = (pos % GRID) * -PIECE_SIZE;
      const y = Math.floor(pos / GRID) * -PIECE_SIZE;
      div.style.backgroundPosition = `${x}px ${y}px`;
      div.dataset.index = index;
      div.dataset.correct = pos;
      div.draggable = true;

      div.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/plain", index);
      });
      div.addEventListener("dragover", e => {
        e.preventDefault();
        div.classList.add("drag-over");
      });
      div.addEventListener("dragleave", () => {
        div.classList.remove("drag-over");
      });
      div.addEventListener("drop", e => {
        e.preventDefault();
        div.classList.remove("drag-over");
        const from = parseInt(e.dataTransfer.getData("text/plain"));
        swapPieces(from, index);
      });

      puzzle.appendChild(div);
    });
  }

  // タッチ対応
  let touchIndex = null;
  puzzle.addEventListener("touchstart", e => {
    const touched = document.elementFromPoint(
      e.touches[0].clientX,
      e.touches[0].clientY
    );
    if (touched?.classList.contains("piece")) {
      touchIndex = parseInt(touched.dataset.index);
    }
  }, { passive: false });

  puzzle.addEventListener("touchend", e => {
    const target = document.elementFromPoint(
      e.changedTouches[0].clientX,
      e.changedTouches[0].clientY
    );
    if (target?.classList.contains("piece")) {
      const toIndex = parseInt(target.dataset.index);
      if (touchIndex !== null && toIndex !== null && touchIndex !== toIndex) {
        swapPieces(touchIndex, toIndex);
      }
    }
    touchIndex = null;
  }, { passive: false });

  function swapPieces(from, to) {
    [pieces[from], pieces[to]] = [pieces[to], pieces[from]];
    updatePuzzle();
    checkSolved();
  }

  function updatePuzzle() {
    [...puzzle.children].forEach((div, i) => {
      const pos = pieces[i];
      const x = (pos % GRID) * -PIECE_SIZE;
      const y = Math.floor(pos / GRID) * -PIECE_SIZE;
      div.style.backgroundPosition = `${x}px ${y}px`;
      div.dataset.correct = pos;
    });
  }

  function checkSolved() {
    const isCorrect = pieces.every((pos, i) => pos === i);
    if (isCorrect) {
      message.textContent = "かんせい！すごーい！🎉";
      startConfetti();
      setTimeout(() => {
        currentImageIndex = (currentImageIndex + 1) % images.length;
        initPuzzle();
      }, 3000);
    }
  }

  function startConfetti() {
    for (let i = 0; i < 100; i++) {
      const div = document.createElement("div");
      div.style.left = Math.random() * 100 + "vw";
      div.style.background = `hsl(${Math.random() * 360}, 100%, 80%)`;
      div.style.animationDelay = Math.random() * 2 + "s";
      confetti.appendChild(div);
    }
  }

  initPuzzle();
</script>

</body>
</html>
